  next-self: 'La etapa siguiente no puede ser la misma campaña.'
  next-unknown: 'La etapa siguiente <detail> no existe (todavía).'
  bossbar-color-invalid: 'Color de bossbar no válido (<detail>).'
  bossbar-overlay-invalid: 'Estilo de bossbar no válido (<detail>).'
  milestone-invalid: 'Hito no válido (<detail>): de 1 a 100 %.'
  milestone-duplicate: 'Hito repetido: <detail>%.'
  personal-invalid: 'Hito personal no válido (<detail>).'
  personal-unreachable: 'El hito personal <detail> supera el máximo por jugador: nadie lo alcanzará.'
  personal-global: 'Recompensa global en un hito personal (se ejecuta una vez por jugador): <detail>.'
  top-invalid: 'Puesto no válido (<detail>).'
  top-global: 'Recompensa global en la clasificación: <detail>.'
  placeholder-unknown: 'Variable desconocida: <detail>.'
  no-rewards: 'No tiene ninguna recompensa.'
  reward-invalid: 'Recompensa no válida (<detail>): formato TIPO: valor.'
  reward-empty: 'Recompensa vacía: <detail>.'
  command-blocked: 'Comando bloqueado en config.yml: <detail>.'
  global-player: '{player} en un comando de una vez quedará vacío: <detail>.'
  item-invalid: 'Objetos mal escritos (MATERIAL cantidad, máx. 2304): <detail>.'

  events-missing: 'EventsPL no está instalado; esta recompensa fallará: <detail>.'
  type-invalid: 'Tipo de objetivo desconocido (<detail>).'
  end-policy-invalid: 'end-policy desconocida (<detail>).'
  policy-invalid: 'Política de hito desconocida (<detail>).'

gui:
  error: '<red>Ha habido un error con ese botón; está en el registro del servidor.'
  common:
    back:
      name: '<gray>Volver'
      lore: []
    close:
      name: '<red>Cerrar'
      lore: []
    empty:
      name: '<gray>No hay nada aquí'
      lore: []
    gone:
      name: '<red>Esta campaña ya no existe'
      lore: []
    previous:
      name: '<yellow>Página anterior'
      lore: ['<gray>Ir a la <page> de <pages>']
    next:
      name: '<yellow>Página siguiente'
      lore: ['<gray>Ir a la <page> de <pages>']
    page: '<white>Página <page>/<pages> <gray>(<count>)'
    enabled: 'sí'
    disabled: 'no'
    no-limit: 'sin límite'
    not-running: '-'
    none: 'ninguna'
    any: 'cualquiera'
    all-worlds: 'todos'
    default: 'el de messages.yml'
  confirm:
    title: '<dark_red>¿Seguro?'
    question: '<yellow>¿Confirmas?'
    accept:
      name: '<green>Sí, confirmar'
      lore: []
    cancel:
      name: '<red>No, volver'
      lore: []
  input:
    hint: '<gray>Escribe en el chat o pulsa '
    cancel-button: '<red><bold>[Cancelar]'
    expired: '<gray>Se acabó el tiempo para escribir; no se ha cambiado nada.'
    id: '<aqua>Escribe el ID de la campaña (minúsculas, números, _ y -). No se podrá cambiar.'
    name: '<aqua>Escribe el nombre (admite MiniMessage, ej. <gray>\<gold>Caza de zombis</gray>).'
    description: '<aqua>Escribe la descripción (o - para dejarla vacía).'
    icon: '<aqua>Escribe el material del icono (o ten el objeto en la mano al pulsar).'
    goal: '<aqua>Escribe la cantidad necesaria.'
    duration: '<aqua>Escribe la duración (ej. 7d, 12h, 1d12h) o - para sin límite.'
    deadline: '<aqua>Escribe la fecha límite como AAAA-MM-DD HH:MM o - para quitarla.'
    min: '<aqua>Escribe la aportación mínima para las recompensas de participantes.'
    max: '<aqua>Escribe la aportación máxima que cuenta por jugador (0 = sin límite).'
    next: '<aqua>Escribe el ID de la campaña que empieza al completar esta (o - para ninguna).'
    message: '<aqua>Escribe el mensaje (MiniMessage, variables {goal_name} {goal} {progress} {percent}) o - para el de messages.yml.'
    targets: '<aqua>Escribe los objetivos separados por espacios o comas (ej. ZOMBIE SKELETON o IRON_ORE).'
    percent: '<aqua>Escribe el porcentaje del hito (1-100).'
    personal: '<aqua>Escribe la aportación personal que da la recompensa.'
    rank: '<aqua>Escribe el puesto de la clasificación (1-45).'
    reward: '<aqua>Recompensa <white><type></white>: <gray><help></gray>. Variables: {player} {goal_name} {contribution} {rank}…'

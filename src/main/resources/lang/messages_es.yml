# Textos de GoalsPL en MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# Las claves nuevas de cada versión se añaden solas sin tocar las que hayas cambiado.
language: es
prefix: '<dark_aqua>[<aqua>Comunidad</aqua>]</dark_aqua> '
no-permission: '<red>No tienes permiso para eso.'

announce:
  started: '<green>¡Nueva meta comunitaria: <name><green>! Objetivo: <yellow><goal></yellow>. Tiempo: <yellow><time></yellow>. Usa <aqua>/goals</aqua> para verla.'
  paused: '<yellow>La meta <name><yellow> está en pausa.'
  resumed: '<green>La meta <name><green> vuelve a estar activa.'
  milestone: '<gold>¡Hito alcanzado en <name><gold>: <yellow><percent>%</yellow>! (<progress>/<goal>)'
  completed: '<green><bold>¡Meta completada!</bold> <name><green> ha llegado a <yellow><goal></yellow>. ¡Gracias a todos!'
  cancelled: '<red>La meta <name><red> se ha cancelado.'
  expired: '<gray>Se acabó el tiempo de <name><gray>: se llegó a <progress>/<goal> (<percent>%).'
  top-header: '<gold>Quién más aportó a <name><gold>:'
  top-line: '<yellow>#<rank></yellow> <white><player></white> <gray>- <amount>'

bossbar:
  title: '<name> <white><progress>/<goal></white> <gray>(<percent>%)'
  title-timed: '<name> <white><progress>/<goal></white> <gray>(<percent>%) · <time>'

rewards:
  pending-added: '<yellow>Parte de tu recompensa no se pudo entregar (inventario lleno u otro problema). Queda pendiente: usa <aqua>/goals claim</aqua>.'
  claimed: '<green>Has recibido <count> recompensas pendientes.'
  nothing: '<gray>No tienes recompensas pendientes.'
  still-pending: '<yellow>Te quedan <count> recompensas por entregar (¿inventario lleno?). Vuelve a probar con <aqua>/goals claim</aqua>.'
  permission-expired: '<gray>Ha caducado tu permiso temporal <white><permission></white>.'

deliver:
  done: '<green>Has entregado <yellow><amount></yellow> <item>. ¡Gracias!'
  nothing: '<red>No hay nada que entregar: no tienes ese objeto (sin nombre ni encantamientos), la meta ya está completa o llegaste a tu máximo.'
  not-delivery: '<red>Esa meta no es de entregar materiales.'
  not-active: '<red>Esa meta no está activa ahora.'
  not-accepted: '<red>Esa meta no acepta ese objeto.'
  wrong-world: '<red>Esa meta no cuenta en este mundo.'

command:
  unknown: '<red>Subcomando desconocido: <value>. Usa <aqua>/goals help</aqua>.'
  player-only: '<red>Eso solo lo puede usar un jugador.'
  missing-id: '<red>Falta el ID de la campaña.'
  usage: '<red>Uso: <usage>'
  reloaded: '<green>Configuración, textos, plantillas y campañas recargados.'
  goals-header: '<aqua>Metas en curso (<count>):'
  goals-line: '<gray>- <white><id></white> <name> <gray><progress>/<goal> (<percent>%) · <state>'
  info: '<aqua><name> <gray>(<id>)<newline><gray>Estado: <white><state></white> · Tipo: <white><type></white> · Ejecución #<run><newline><gray>Progreso: <white><progress>/<goal></white> (<percent>%) · Participantes: <white><participants></white> · Tiempo: <white><time>'
  milestone-done: '<green>  ✔ <percent>%'
  milestone-todo: '<gray>  ✘ <percent>%'
  top-header: '<gold>Clasificación de <name><gold>:'
  top-empty: '<gray>Nadie ha aportado todavía.'
  progress-done: '<green>Progreso de <id>: <yellow><progress>/<goal></yellow>.'
  set-no-player: '<red>Con =valor no se puede indicar jugador; usa +n o -n para su aportación.'
  unknown-player: '<red>No conozco a ningún jugador llamado <value>.'
  history-header: '<aqua>Historial de <id> (página <page>):'
  history-empty: '<gray>Sin entradas.'
  history-line: '<gray><date> <white><campaign></white> <yellow><action></yellow> <gray>por <white><actor></white> <dark_gray><details>'

help:
  header: '<aqua>GoalsPL <version> - comandos:'
  line: '<yellow><usage></yellow> <gray>- <description>'
  usage:
    help: '/goals help'
    goals: '/goals goals'
    info: '/goals info <id>'
    top: '/goals top <id>'
    contribute: '/goals contribute <id>'
    claim: '/goals claim'
    admin: '/goals admin'
    start: '/goals start <id>'
    pause: '/goals pause <id>'
    resume: '/goals resume <id>'
    complete: '/goals complete <id>'
    cancel: '/goals cancel <id>'
    progress: '/goals progress <id> <+n|-n|=n> [jugador]'
    history: '/goals history [id] [página]'
    reload: '/goals reload'
  description:
    help: 'Esta ayuda.'
    goals: 'Metas activas (menú; en consola, lista).'
    info: 'Detalle de una campaña.'
    top: 'Clasificación de aportaciones.'
    contribute: 'Abrir la entrega de materiales.'
    claim: 'Recibir tus recompensas pendientes.'
    admin: 'Panel de administración.'
    start: 'Iniciar (publicar) una campaña; si ya terminó, empieza una ejecución nueva desde cero.'
    pause: 'Pausar: deja de contar y se para el reloj.'
    resume: 'Reanudar una campaña pausada.'
    complete: 'Completar ya: entrega los hitos que falten, la clasificación y la siguiente etapa.'
    cancel: 'Cancelar (devuelve lo entregado si la campaña lo indica).'
    progress: 'Sumar, restar o fijar progreso; con jugador, también a su aportación.'
    history: 'Historial de acciones, entregas y recompensas.'
    reload: 'Recargar config.yml, messages.yml, rewards.yml y goals.yml.'

result:
  done: '<green>Hecho (<id>).'
  OK: '<green>Hecho.'
  UNKNOWN: '<red>No existe la campaña <id>.'
  ALREADY_RUNNING: '<red><id> ya está en curso.'
  NOT_RUNNING: '<red><id> no está en curso.'
  NOT_ACTIVE: '<red><id> no está activa.'
  NOT_PAUSED: '<red><id> no está pausada.'
  INVALID: '<red><id> tiene errores: ábrela en el editor y revisa el resumen.'
  DEADLINE_PAST: '<red>La fecha límite de <id> ya ha pasado: cámbiala antes de iniciarla.'
  READ_ONLY: '<red>goals.yml tiene un error de formato y no se puede guardar desde el juego. Corrígelo y usa /goals reload.'
  IN_USE: '<red><id> está en curso: cancélala o complétala antes de borrarla.'
  EXISTS: '<red>Ya hay una campaña con ese ID.'

state:
  DRAFT: 'Borrador'
  ACTIVE: 'Activa'
  PAUSED: 'Pausada'
  COMPLETED: 'Completada'
  CANCELLED: 'Cancelada'
  EXPIRED: 'Vencida'

objective:
  KILL_ENTITY: 'Derrotar criaturas'
  BREAK_BLOCK: 'Romper bloques'
  DELIVER_ITEM: 'Entregar materiales'
  ADMIN: 'Progreso administrativo'
objective-help:
  KILL_ENTITY:
    - '<gray>Cuenta cada criatura de la lista que'
    - '<gray>mata un jugador en los mundos elegidos.'
  BREAK_BLOCK:
    - '<gray>Cuenta los bloques de la lista que rompen'
    - '<gray>los jugadores (no los colocados por ellos).'
  DELIVER_ITEM:
    - '<gray>Los jugadores entregan los objetos pedidos'
    - '<gray>desde un menú, con confirmación.'
  ADMIN:
    - '<gray>Solo avanza con /goals progress o la API'
    - '<gray>de otros plugins.'

policy:
  COMMUNITY: 'toda la comunidad'
  PARTICIPANTS: 'participantes (mínimo de aportación)'

end-policy:
  KEEP: 'se quedan en la campaña'
  REFUND: 'se devuelven'

reward-type:
  COMMAND: 'Comando (por jugador)'
  MESSAGE: 'Mensaje'
  ITEM: 'Objetos'
  PERMISSION: 'Permiso temporal'
  BROADCAST: 'Anuncio'
  GLOBAL_COMMAND: 'Comando (una vez)'
  EVENT: 'Evento de EventsPL'
reward-lore:
  COMMAND:
    - '<gray>Comando de consola para cada jugador.'
    - '<gray>Ej.: <white>eco give {player} 100'
  MESSAGE:
    - '<gray>Mensaje privado al jugador.'
  ITEM:
    - '<gray>Objetos simples: <white>MATERIAL cantidad'
    - '<gray>Lo que no cabe queda pendiente.'
  PERMISSION:
    - '<gray>Permiso durante un tiempo:'
    - '<white>permiso duración <gray>(ej. essentials.fly 1h)'
  BROADCAST:
    - '<gray>Anuncio a todo el servidor, una vez.'
  GLOBAL_COMMAND:
    - '<gray>Comando de consola una sola vez,'
    - '<gray>sin jugador.'
  EVENT:
    - '<gray>Inicia un evento de EventsPL'
    - '<gray>por su ID (si está instalado).'
reward-help:
  COMMAND: 'Comando sin barra, ej. eco give {player} 100'
  MESSAGE: 'Texto MiniMessage, ej. <green>Gracias {player}'
  ITEM: 'MATERIAL cantidad, ej. DIAMOND 3'
  PERMISSION: 'permiso duración, ej. essentials.fly 1h'
  BROADCAST: 'Texto MiniMessage para todos'
  GLOBAL_COMMAND: 'Comando sin barra, ej. weather clear'
  EVENT: 'ID del evento de EventsPL'

history-action:
  CREATED: 'Creada'
  EDITED: 'Editada'
  DELETED: 'Borrada'
  STARTED: 'Iniciada'
  PAUSED: 'Pausada'
  RESUMED: 'Reanudada'
  COMPLETED: 'Completada'
  CANCELLED: 'Cancelada'
  EXPIRED: 'Vencida'
  MILESTONE: 'Hito'
  PROGRESS: 'Ajuste de progreso'
  DELIVERY: 'Entrega'
  REFUND: 'Devolución'
  REWARD: 'Recompensa entregada'
  REWARD_FAILED: 'Recompensa pendiente o fallida'
  NEXT: 'Etapa siguiente'
  ERROR: 'Error'

validation:
  id-invalid: 'ID no válido (<detail>): minúsculas, números, _ y -, de 2 a 32.'
  name-empty: 'Falta el nombre.'
  goal-invalid: 'La cantidad necesaria no es válida (<detail>).'

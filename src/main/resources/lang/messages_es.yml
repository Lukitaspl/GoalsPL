    adjust-player: '<aqua>Escribe cuánto sumar (o restar con -) a la aportación de <white><player></white> y al total.'
    bad-id: '<red>ID no válido: minúsculas, números, _ y -, de 2 a 32 caracteres.'
    bad-number: '<red>Eso no es un número.'
    bad-range: '<red>Tiene que ser un número entre <min> y <max>.'
    bad-duration: '<red>Duración no válida: <value> (ej. 7d, 12h, 90m).'
    bad-date: '<red>Fecha no válida: <value> (AAAA-MM-DD HH:MM).'
